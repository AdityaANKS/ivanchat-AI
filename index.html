        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            overscroll-behavior-y: contain;
        }
        .dark body {
            background-color: #020617;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .h-screen-safe {
            height: 100vh;
            height: -webkit-fill-available;
        }

        /* High-end Narrative Animations */
        @keyframes word-pulse {
          0% { transform: scale(1.1); box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
          50% { transform: scale(1.15); box-shadow: 0 0 25px rgba(99, 102, 241, 0.6); }
          100% { transform: scale(1.1); box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
        }

        .active-sentence {
          background: linear-gradient(90deg, rgba(99, 102, 241, 0.08) 0%, rgba(99, 102, 241, 0) 100%);
          border-left: 4px solid #6366f1;
          padding-left: 8px;
          border-radius: 4px;
        }

        .dark .active-sentence {
          background: linear-gradient(90deg, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 100%);
        }
    </style>
